[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelli-e-reader"
version = "0.1.0"
description = "NLP tool that simplifies text complexity using CEFR levels"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Sujith Gunjur Umapathy" },
    { name = "Prajyot Suvarna" },
]
requires-python = ">=3.11"
# Pinned to versions verified working on Python 3.12 (see README for how they
# were tested). `pip install -e .` installs exactly these.
dependencies = [
    "Flask==3.1.3",
    "flask-cors==6.0.5",
    "nltk==3.10.3",
    "pymupdf==1.28.2",
    "sentence-transformers==6.0.0",
    "torch==2.13.0",
    "pandas==3.0.3",
    "ipykernel"
]

[project.optional-dependencies]
# src/intelli_e_reader/cefr_model/{train,test}.py trains the CEFR-prediction
# model itself (separate from running the live demo, which reads the
# pre-built data/processed/family2_word_synonyms.parquet). Left unpinned
# since none of this has been ported/tested on a modern Python yet --
# install with `pip install -e ".[training]"` and expect to have to fix things.
training = [
    "tensorflow",
    "keras",
    "scikit-learn",
    "matplotlib",
    "spacy",
    "selenium",
    "beautifulsoup4",
]

# For exploring data/ in a notebook (e.g. notebook/Dataset-EDA.ipynb), and for
# src/intelli_e_reader/data_utils.py (pyarrow is needed for parquet I/O).
# `pip install -e ".[notebook]"`.
notebook = [
    "jupyter",
    "matplotlib",
    "seaborn",
    "pyarrow"
]

[tool.setuptools.packages.find]
where = ["src"]
