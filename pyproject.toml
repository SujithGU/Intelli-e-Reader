[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelli-e-reader"
version = "0.1.0"
description = "NLP tool that simplifies text complexity using CEFR levels"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Sujith Gunjur Umapathy" },
    { name = "Prajyot Suvarna" },
]
requires-python = ">=3.11"
# Pinned to versions verified working on Python 3.12 (see README for how they
# were tested). `pip install -e .` installs exactly these. pandas is a range,
# not an exact pin, specifically so MLflow (which needs pandas<3) is
# installable in the same environment -- re-verified against 2.x after
# relaxing this (see README/context for the verification method).
dependencies = [
    "Flask==3.1.3",
    "flask-cors==6.0.5",
    "nltk==3.10.3",
    "pymupdf==1.28.2",
    "sentence-transformers==6.0.0",
    "torch==2.13.0",
    "pandas>=2.2,<3",
    "ipykernel",
    "pyarrow"
]

[project.optional-dependencies]
# For notebook work (data exploration, the CEFR-prediction model rebuild in
# notebook/CEFR-Model-Training.ipynb, the Gemini LLM baseline) -- one group,
# one environment, `uv sync --extra notebook`. (The old separate `training`
# extras group -- tensorflow/keras/spacy/selenium/beautifulsoup4 for the
# original, abandoned TF/Keras cefr_model/train.py -- is gone; that plan was
# superseded by this rebuild.)
notebook = [
    "jupyter",
    "matplotlib",
    "seaborn",
    "pyarrow",
    "kagglehub[pandas-datasets]",
    "openpyxl",
    "python-dotenv",
    "google-genai",
    "mlflow",
    "scikit-learn",
    "transformers",
    "tensorboard",
]

[tool.setuptools.packages.find]
where = ["src"]
